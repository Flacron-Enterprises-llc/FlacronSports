name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths-ignore:
      - "mobile/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
