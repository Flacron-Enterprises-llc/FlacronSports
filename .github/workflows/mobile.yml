name: Mobile app

# Builds the Flutter Android app and sends the APK to testers through
# Firebase App Distribution. Runs on every push to main that touches the app.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 and ANDROID_KEYSTORE_BASE64 secrets are required"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          if [ -d test ] && ls test/*_test.dart >/dev/null 2>&1; then flutter test; else echo "No tests"; fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION (${{ github.run_number }})"

      - name: Release notes
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            echo "FlacronSport build ${{ github.run_number }} (${GITHUB_SHA::7})"
            if [ -n "$INPUT_NOTES" ]; then echo "$INPUT_NOTES"; else git log -5 --pretty='- %s' -- . ; fi
          } > "$RUNNER_TEMP/release-notes.txt"
          cat "$RUNNER_TEMP/release-notes.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: flacronsport-${{ github.run_number }}.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Distribute to testers (Firebase App Distribution)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          TESTERS: ${{ vars.FIREBASE_TESTERS }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15 appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$APP_ID" \
            --testers "$TESTERS" \
            --groups "$GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"
          rm -f "$RUNNER_TEMP/firebase-sa.json"
