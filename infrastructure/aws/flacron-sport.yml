AWSTemplateFormatVersion: "2010-09-09"
Description: FlacronSport backend on ECS Fargate behind an HTTP API (app_id=flacron-sport).

# API Gateway with a VPC Link replaces an ALB: it provides HTTPS without a custom
# domain and has no hourly charge. Tasks use public subnets with no inbound rule
# from the internet, so no NAT gateway is needed.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DesiredCount:
    Type: Number
    Default: 1
  ImageTag:
    Type: String
    Default: bootstrap
  AppBaseUrl:
    Type: String
  StripeSecretArn:
    Type: String
  StripeWebhookSecretArn:
    Type: String
  FirebaseSecretArn:
    Type: String
  CronSecretArn:
    Type: String
  PricePlusMonthly:
    Type: String
  PricePlusAnnual:
    Type: String
  PricePremiumMonthly:
    Type: String
  PricePremiumAnnual:
    Type: String
  PortalConfiguration:
    Type: String
  EmailIdentity:
    Type: String
    Default: flacronsport.com
  BudgetEmail:
    Type: String
  GithubRepository:
    Type: String
    Default: Flacron-Enterprises-llc/FlacronSports
  GithubOidcProviderArn:
    Type: String
  AmplifyAppId:
    Type: String

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: flacron-sport
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /flacron-sport/api
      RetentionInDays: 30

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: flacron-sport
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flacron-sport-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:flacron-sport/production/*

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flacron-sport-ecs-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailIdentity}

  LinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FlacronSport API Gateway VPC Link
      VpcId: !Ref VpcId

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FlacronSport API tasks, reachable only from the VPC Link
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LinkSecurityGroup

  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: flacron-sport.local
      Vpc: !Ref VpcId

  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api
      NamespaceId: !Ref Namespace
      DnsConfig:
        DnsRecords:
          - Type: SRV
            TTL: 30
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: flacron-sport-api
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/flacron-sport:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          Environment:
            - { Name: APP_BASE_URL, Value: !Ref AppBaseUrl }
            - { Name: SES_REGION, Value: !Ref AWS::Region }
            - { Name: EMAIL_FROM, Value: !Sub "FlacronSport <noreply@${EmailIdentity}>" }
            - { Name: STRIPE_PRICE_PLUS_MONTHLY, Value: !Ref PricePlusMonthly }
            - { Name: STRIPE_PRICE_PLUS_ANNUAL, Value: !Ref PricePlusAnnual }
            - { Name: STRIPE_PRICE_PREMIUM_MONTHLY, Value: !Ref PricePremiumMonthly }
            - { Name: STRIPE_PRICE_PREMIUM_ANNUAL, Value: !Ref PricePremiumAnnual }
            - { Name: STRIPE_PORTAL_CONFIGURATION, Value: !Ref PortalConfiguration }
          Secrets:
            - { Name: STRIPE_SECRET_KEY, ValueFrom: !Ref StripeSecretArn }
            - { Name: STRIPE_WEBHOOK_SECRET, ValueFrom: !Ref StripeWebhookSecretArn }
            - { Name: CRON_SECRET, ValueFrom: !Ref CronSecretArn }
            - { Name: FIREBASE_ADMIN_PROJECT_ID, ValueFrom: !Sub "${FirebaseSecretArn}:project_id::" }
            - { Name: FIREBASE_ADMIN_CLIENT_EMAIL, ValueFrom: !Sub "${FirebaseSecretArn}:client_email::" }
            - { Name: FIREBASE_ADMIN_PRIVATE_KEY, ValueFrom: !Sub "${FirebaseSecretArn}:private_key::" }

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: flacron-sport-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: false
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      ServiceRegistries:
        - RegistryArn: !GetAtt DiscoveryService.Arn
          ContainerName: api
          ContainerPort: 3000

  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !Ref DesiredCount
      MaxCapacity: 3

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: flacron-sport-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 65
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: flacron-sport-api
      ProtocolType: HTTP

  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: flacron-sport
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds: [!Ref LinkSecurityGroup]

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLink
      IntegrationUri: !GetAtt DiscoveryService.Arn
      PayloadFormatVersion: "1.0"

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: flacron-sport-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref BudgetEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: flacron-sport-api-5xx
      AlarmDescription: FlacronSport API returned server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]

  RunningTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: flacron-sport-api-cpu-high
      AlarmDescription: FlacronSport API CPU stayed high
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: flacron-sport-api }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: flacron-sport-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 30, Unit: USD }
        CostFilters:
          TagKeyValue:
            - user:project$flacron-sport
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

  GithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flacron-sport-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GithubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                  - amplify:GetJob
                  - amplify:GetBranch
                Resource: !Sub arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}*
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt TaskRole.Arn

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  DeployRoleArn:
    Value: !GetAtt GithubDeployRole.Arn
