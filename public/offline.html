<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · FlacronSport</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #001a3f; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
  img { height: 40px; }
  p { color: rgb(255 255 255 / 0.8); }
  button { margin-top: 8px; padding: 10px 18px; border: 0; border-radius: 6px; background: #fe4b01; color: #0a1a33; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/brand/fs-mark-reversed.png" alt="FlacronSport">
    <h1 id="title">You are offline</h1>
    <p id="body">Reconnect to see the latest scores.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    var button = document.getElementById("retry")
    button.addEventListener("click", function () { location.reload() })
    if (location.pathname.indexOf("/fr") === 0 || /^fr\b/i.test(navigator.language)) {
      document.documentElement.lang = "fr"
      document.title = "Hors ligne · FlacronSport"
      document.getElementById("title").textContent = "Vous êtes hors ligne"
      document.getElementById("body").textContent = "Reconnectez-vous pour voir les derniers scores."
      button.textContent = "Réessayer"
    }
  </script>
</body>
</html>
